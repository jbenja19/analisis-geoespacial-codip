[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analisis-geoespacial-codip"
version = "0.1.1"
description = "Segmentacion de Proyectos Inmobiliarios mediante Analisis Geoespacial"
authors = [{ name = "CODIP Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
