project:
  name: analisis-geoespacial-codip
  version: "0.1.1"
  description: "Segmentacion geoespacial de proyectos inmobiliarios - CODIP"

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_external: data/external
  reports: reports
  paper_figures: paper/figures

geospatial:
  crs_default: "EPSG:4326"
  # Referencia métrica apropiada para Lima Metropolitana (UTM 18S).
  # Para buffers/distancias, el código usa auto-UTM por defecto para evitar
  # aplicar esta zona fija a datasets ubicados fuera de Lima.
  crs_projected_lima: "EPSG:32718"
  projected_crs_strategy: "auto_utm"

clustering:
  algorithms: ["kmeans", "dbscan", "hdbscan"]
  n_clusters_range: [2, 10]
  random_state: 42

logging:
  level: INFO
  format: "{time} | {level} | {message}"
