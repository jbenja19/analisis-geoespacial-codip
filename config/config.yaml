project:
  name: analisis-geoespacial-codip
  version: "0.2.0"
  stage: exploratory_analysis
  description: "Análisis geoespacial y clustering de oferta inmobiliaria en La Victoria (Estudio Grupo Lar / CODIP)"

paths:
  data_raw: data/raw
  data_external: data/external
  data_interim: data/interim
  data_processed: data/processed
  schemas_source: schemas/source
  schemas_canonical: schemas/canonical
  notebooks: notebooks
  reports: reports

raw_data:
  immutable: true
  overwrite_allowed: false

geospatial:
  source_crs: "EPSG:4326"
  analysis_crs: "EPSG:32718"

analysis:
  unit_of_analysis: "proyectos_inmobiliarios_la_victoria"
  temporal_scope: "septiembre_2025"
  methodology: "clustering_kmeans_pca_and_embeddings_hdbscan"
