project:
  name: analisis-geoespacial-codip
  version: "0.1.2"
  stage: scaffold
  description: "Estructura base para iniciar el análisis cuando lleguen las fuentes raw"

paths:
  data_raw: data/raw
  data_external: data/external
  data_interim: data/interim
  data_processed: data/processed
  schemas_source: schemas/source
  schemas_canonical: schemas/canonical
  notebooks: notebooks
  reports: reports

raw_data:
  immutable: true
  overwrite_allowed: false

geospatial:
  source_crs: null
  analysis_crs: null

analysis:
  unit_of_analysis: null
  temporal_scope: null
  methodology: null

logging:
  level: INFO
  format: "{time} | {level} | {message}"
